name: StoryWorld CI

on:
  pull_request:
    branches:
      - feat/backend-foundation
      - main
  push:
    branches:
      - feat/backend-foundation
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://storyworld:storyworld@127.0.0.1:5432/storyworld?schema=public
      BETTER_AUTH_SECRET: storyworld-ci-only-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      API_SERVER_URL: http://localhost:4000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint frontend
        run: pnpm lint:web

      - name: Typecheck frontend
        run: pnpm typecheck:web

      - name: Build API
        run: pnpm build:api

      - name: Build frontend
        run: pnpm build:web
