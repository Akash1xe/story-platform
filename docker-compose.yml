services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storyworld}
      POSTGRES_USER: ${POSTGRES_USER:-storyworld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storyworld}
    ports:
      - "5432:5432"
    volumes:
      - storyworld-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storyworld} -d ${POSTGRES_DB:-storyworld}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storyworld-postgres-data:
